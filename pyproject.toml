[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".git", "__pycache__", ".venv", "venv",
    "*/alembic/versions/*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "F401"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "tests"]
python_files = ["test_*.py", "*_test.py"]
