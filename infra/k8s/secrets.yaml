# IMPORTANT: Replace placeholder values with base64-encoded secrets before applying.
# Generate with: echo -n "your-value" | base64
# Apply with: kubectl apply -f secrets.yaml -n resume-platform
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: resume-platform
type: Opaque
data:
  JWT_SECRET_KEY: <base64-encoded-jwt-secret>
  OPENAI_API_KEY: <base64-encoded-openai-key>
  POSTGRES_PASSWORD: <base64-encoded-postgres-password>
  RABBITMQ_PASSWORD: <base64-encoded-rabbitmq-password>
