upstream auth_service     { server auth_service:8001; }
upstream file_processor   { server file_processor:8002; }
upstream nlp_pipeline     { server nlp_pipeline:8003; }
upstream scoring_engine   { server scoring_engine:8004; }
upstream llm_service      { server llm_service:8005; }
upstream frontend         { server frontend:80; }

server {
    listen 80;
    client_max_body_size 20M;

    # Auth
    location /api/auth/ {
        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Files / Jobs
    location /api/files/ {
        proxy_pass http://file_processor/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # NLP
    location /api/nlp/ {
        proxy_pass http://nlp_pipeline/nlp/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Scoring
    location /api/scoring/ {
        proxy_pass http://scoring_engine/scoring/;
        proxy_set_header Host $host;
    }

    # LLM
    location /api/llm/ {
        proxy_pass http://llm_service/llm/;
        proxy_set_header Host $host;
        proxy_read_timeout 45s;
    }

    # Health checks passthrough
    location ~ ^/api/(auth|files|nlp|scoring|llm)/health {
        proxy_pass http://$1_service/health;
        proxy_set_header Host $host;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
