server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests directly to each backend service
    location /api/auth/ {
        proxy_pass http://auth_service:8001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/files/ {
        proxy_pass http://file_processor:8002/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    location /api/nlp/ {
        proxy_pass http://nlp_pipeline:8003/nlp/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /api/scoring/ {
        proxy_pass http://scoring_engine:8004/scoring/;
        proxy_set_header Host $host;
    }

    location /api/llm/ {
        proxy_pass http://llm_service:8005/llm/;
        proxy_set_header Host $host;
        proxy_read_timeout 45s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
