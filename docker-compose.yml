

# ─── Shared environment ───────────────────────────────────────────────────────
x-common-env: &common-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resume_db
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-production}
  JWT_ALGORITHM: HS256
  JWT_EXPIRY_HOURS: "24"
  LOG_LEVEL: INFO
  CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    
    restart: unless-stopped

  # ─── Application Services ─────────────────────────────────────────────────────
  auth_service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      <<: *common-env
      PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  file_processor:
    build:
      context: .
      dockerfile: services/file_processor/Dockerfile
    environment:
      <<: *common-env
      PORT: "8002"
      UPLOAD_DIR: /tmp/uploads
      MAX_RESUME_SIZE_MB: "5"
      MAX_JD_SIZE_MB: "2"
      NLP_PIPELINE_URL: http://nlp_pipeline:8003
      SCORING_ENGINE_URL: http://scoring_engine:8004
      LLM_SERVICE_URL: http://llm_service:8005
    volumes:
      - uploads_data:/tmp/uploads
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nlp_pipeline:
    build:
      context: .
      dockerfile: services/nlp_pipeline/Dockerfile
    environment:
      <<: *common-env
      PORT: "8003"
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      SPACY_MODEL: en_core_web_sm
    ports:
      - "8003:8003"
    depends_on:
      - redis
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8003/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  scoring_engine:
    build:
      context: .
      dockerfile: services/scoring_engine/Dockerfile
    environment:
      <<: *common-env
      PORT: "8004"
      NLP_PIPELINE_URL: http://nlp_pipeline:8003
      LLM_SERVICE_URL: http://llm_service:8005
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8004/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  llm_service:
    build:
      context: .
      dockerfile: services/llm_service/Dockerfile
    environment:
      <<: *common-env
      PORT: "8005"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: "30"
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: services/celery_worker/Dockerfile
    environment:
      <<: *common-env
      NLP_PIPELINE_URL: http://nlp_pipeline:8003
      SCORING_ENGINE_URL: http://scoring_engine:8004
      LLM_SERVICE_URL: http://llm_service:8005
    volumes:
      - uploads_data:/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth_service
      - file_processor
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  uploads_data:
